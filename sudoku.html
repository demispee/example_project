<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku \ LAB271</title>
  <style>
    /* Lab271 design system, dark theme. TT Interphases is licensed via Schuberg Philis
       and loads from a local fonts/ folder that is not shared; elsewhere the fallbacks apply. */
    @font-face { font-family: "TT Interphases"; src: local("TT Interphases"), url("fonts/TTInterphases-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "TT Interphases"; src: local("TT Interphases Bold"), url("fonts/TTInterphases-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "TT Interphases"; src: local("TT Interphases Black"), url("fonts/TTInterphases-Black.ttf") format("truetype"); font-weight: 900; font-display: swap; }
    @font-face { font-family: "TT Interphases Mono"; src: local("TT Interphases Mono"), url("fonts/TTInterphasesMono-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "TT Interphases Mono"; src: local("TT Interphases Mono Bold"), url("fonts/TTInterphasesMono-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }

    :root {
      --c-canvas: #020C17;
      --c-canvas-2: #061323;
      --c-panel: #082646;
      --c-text: #FFFFFF;
      --c-muted: #8AA0B8;
      --c-border: #12263F;
      --c-tq: #1EE8ED;
      --c-orange: #FF8D33;
      --c-magenta: #FF0089;
      --sans: "TT Interphases", "Avenir Next", "Poppins", "Inter", sans-serif;
      --mono: "TT Interphases Mono", "Courier New", monospace;
      --angle-slash: 14deg;
      --motion: 200ms cubic-bezier(.2, 0, .2, 1);
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--c-canvas);
      color: var(--c-text);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    body { overflow-x: hidden; }
    main {
      position: relative;
      max-width: 1040px;
      margin: 0 auto;
      padding: 56px 40px 0;
      user-select: none;
    }

    /* The one device: the refracted slash, bleeding off the top right */
    .slash {
      position: absolute;
      top: -90px;
      right: 40px;
      display: flex;
      gap: 31px;
      pointer-events: none;
    }
    .slash span {
      display: block;
      height: 240px;
      transform: skewX(var(--angle-slash));
    }
    .slash .tq { width: 44px; border-radius: 8px; background: var(--c-tq); }
    .slash .or { width: 19px; border-radius: 4px; background: var(--c-orange); }

    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--c-tq);
    }
    h1 {
      margin: 10px 0 40px;
      max-width: 760px;
      font-size: clamp(40px, 5vw, 68px);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.09;
    }

    .game {
      display: flex;
      flex-wrap: wrap;
      gap: 40px;
      align-items: flex-start;
    }
    .board-col {
      display: flex;
      flex-direction: column;
      gap: 16px;
      width: min(100%, 480px);
    }
    .side {
      display: flex;
      flex-direction: column;
      gap: 24px;
      flex: 1;
      min-width: 260px;
      max-width: 420px;
    }

    #board {
      position: relative;
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      width: 100%;
      aspect-ratio: 1;
      border: 2px solid var(--c-muted);
      border-radius: 12px 12px 12px 0;
      overflow: hidden;
      background: var(--c-canvas-2);
    }
    .cell {
      display: flex;
      align-items: center;
      justify-content: center;
      border-right: 1px solid var(--c-border);
      border-bottom: 1px solid var(--c-border);
      font-size: min(6vw, 28px);
      color: var(--c-tq);
      cursor: pointer;
      transition: background-color var(--motion);
    }
    .cell.br { border-right: 2px solid var(--c-muted); }
    .cell.bb { border-bottom: 2px solid var(--c-muted); }
    .cell.given { color: var(--c-text); font-weight: 700; }
    .cell.hinted { color: var(--c-muted); }
    .cell.wrong { color: var(--c-magenta); }
    .cell.peer { background: var(--c-canvas); }
    .cell.same { background: var(--c-border); }
    .cell.pattern { background: var(--c-panel); }
    .cell.selected { background: var(--c-panel); box-shadow: inset 0 0 0 2px var(--c-tq); }
    .cell.target { box-shadow: inset 0 0 0 2px var(--c-tq); }
    .cell.flash { animation: flash 0.8s cubic-bezier(.2, 0, .2, 1); }
    @keyframes flash {
      from { background: var(--c-panel); }
    }
    .notes {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      width: 100%;
      height: 100%;
      font-family: var(--mono);
      font-size: min(2.3vw, 11px);
      color: var(--c-muted);
    }
    .notes span {
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .notes .gone {
      color: var(--c-tq);
      text-decoration: line-through;
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 8px;
      padding: 32px;
      box-sizing: border-box;
      background: color-mix(in srgb, var(--c-canvas) 90%, transparent);
    }
    #overlay.show { display: flex; }
    #overlay strong {
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.09;
    }
    #overlay .meta {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--c-muted);
    }

    #pad {
      display: grid;
      grid-template-columns: repeat(9, 1fr);
      gap: 6px;
    }
    #pad button {
      height: 48px;
      padding: 0;
      border: 1px solid var(--c-border);
      border-radius: 10px 10px 10px 0;
      background: var(--c-canvas-2);
      color: var(--c-text);
      font-family: var(--sans);
      font-size: 20px;
    }
    #pad button:hover { background: var(--c-panel); }
    #pad button.done { opacity: 0.45; }

    .field-label {
      display: block;
      margin-bottom: 8px;
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--c-muted);
    }
    select {
      width: 100%;
      height: 44px;
      padding: 0 16px;
      border: 1px solid var(--c-border);
      border-radius: 10px 10px 10px 0;
      background: var(--c-canvas);
      color: var(--c-text);
      font-family: var(--mono);
      font-size: 13px;
      cursor: pointer;
    }

    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .label {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 14px;
      border-radius: 999px 999px 999px 0;
      background: var(--c-panel);
      color: var(--c-tq);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }

    .actions {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .btn {
      height: 44px;
      padding: 0 22px;
      border: 1px solid var(--c-tq);
      border-radius: 999px;
      background: transparent;
      color: var(--c-tq);
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: opacity var(--motion), background-color var(--motion), color var(--motion);
    }
    .btn:hover { opacity: 0.82; }
    .btn.primary, .btn.on { background: var(--c-tq); color: var(--c-canvas); }
    button:active { transform: scale(0.98); }
    button:focus-visible, select:focus-visible {
      outline: 2px solid var(--c-tq);
      outline-offset: 2px;
    }

    #message {
      padding: 16px 22px;
      border: 1px solid var(--c-border);
      border-radius: 20px 20px 20px 0;
      background: var(--c-canvas-2);
      font-size: 15px;
    }
    #message:empty { display: none; }
    #message .eyebrow { display: block; margin-bottom: 6px; }

    .help {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      line-height: 2;
      color: var(--c-muted);
    }
    .bs { color: var(--c-tq); }

    .loader { display: inline-flex; gap: 4px; }
    .loader i {
      width: 8px;
      height: 8px;
      background: var(--c-tq);
      animation: blink 1s cubic-bezier(.2, 0, .2, 1) infinite;
    }
    .loader i:nth-child(2) { animation-delay: 160ms; }
    .loader i:nth-child(3) { animation-delay: 320ms; }
    @keyframes blink {
      0%, 100% { opacity: 0.15; }
      50% { opacity: 1; }
    }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-top: 64px;
      padding: 18px 0 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      font-family: var(--mono);
      font-size: 12px;
      color: var(--c-muted);
    }
    footer svg { height: 32px; width: auto; display: block; }

    @media (max-width: 640px) {
      main { padding: 40px 20px 0; }
      .slash { right: 16px; transform: scale(0.6); transform-origin: top right; }
    }
  </style>
</head>
<body>
  <div class="slash" aria-hidden="true"><span class="tq"></span><span class="or"></span></div>
  <main>
    <div class="eyebrow">LAB271 \ sudoku</div>
    <h1>Logic beats guessing</h1>

    <div class="game">
      <section class="board-col">
        <div id="board">
          <div id="overlay"></div>
        </div>
        <div id="pad"></div>
      </section>

      <section class="side">
        <div>
          <label class="field-label" for="difficulty">difficulty</label>
          <select id="difficulty">
            <option value="1">1 \ very easy</option>
            <option value="2">2 \ easy</option>
            <option value="3">3 \ medium</option>
            <option value="4">4 \ pointing pairs</option>
            <option value="5">5 \ pairs</option>
            <option value="6">6 \ x-wing and triples</option>
            <option value="7">7 \ expert</option>
            <option value="8">8 \ master</option>
            <option value="9">9 \ extreme</option>
            <option value="10">10 \ fiendish</option>
          </select>
        </div>

        <div class="stats">
          <span class="label">level \&nbsp;<span id="level">0</span></span>
          <span class="label">time \&nbsp;<span id="time">0:00</span></span>
          <span class="label">hints \&nbsp;<span id="hints">0</span></span>
          <span class="label">solved \&nbsp;<span id="solved">0</span></span>
        </div>

        <div class="actions">
          <button class="btn primary" id="stepBtn">step</button>
          <button class="btn" id="hintBtn">hint</button>
          <button class="btn" id="notesBtn">notes</button>
          <button class="btn" id="eraseBtn">erase</button>
          <button class="btn" id="solveBtn">solve</button>
          <button class="btn" id="skipBtn">skip</button>
        </div>

        <div id="message"></div>

        <div class="help">
          1 to 9 <span class="bs">\</span> fill in &nbsp; backspace <span class="bs">\</span> erase &nbsp; arrows <span class="bs">\</span> move<br>
          n <span class="bs">\</span> notes &nbsp; t <span class="bs">\</span> hint &nbsp; s <span class="bs">\</span> step
        </div>
      </section>
    </div>

    <footer>
      <div>LAB271 <span class="bs">\</span> a Schuberg Philis lab</div>

  <script>
    const NEXT_PUZZLE_DELAY = 3000;
    const MAX_RATED_GIVENS = 42;
    const GENERATE_BUDGET = 8000; // ms; after this, take the closest puzzle found

    const boardEl = document.getElementById("board");
    const overlayEl = document.getElementById("overlay");
    const padEl = document.getElementById("pad");
    const messageEl = document.getElementById("message");
    const difficultyEl = document.getElementById("difficulty");
    const notesBtn = document.getElementById("notesBtn");
    const solveBtn = document.getElementById("solveBtn");

    let puzzle, solution, values, notes, hinted;
    let selected = null;
    let notesMode = false;
    let locked = false;
    let hints = 0;
    let startTime = 0;
    let solvedCount = Number(localStorage.getItem("sudokuSolved")) || 0;

    // ---------- Generator ----------

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function row(i) { return Math.floor(i / 9); }
    function col(i) { return i % 9; }
    function box(i) { return Math.floor(row(i) / 3) * 3 + Math.floor(col(i) / 3); }

    function isPeer(a, b) {
      return a !== b && (row(a) === row(b) || col(a) === col(b) || box(a) === box(b));
    }

    function candidates(grid, i) {
      const used = new Array(10).fill(false);
      const r = row(i), c = col(i);
      const br = r - r % 3, bc = c - c % 3;
      for (let k = 0; k < 9; k++) {
        used[grid[r * 9 + k]] = true;
        used[grid[k * 9 + c]] = true;
        used[grid[(br + Math.floor(k / 3)) * 9 + bc + k % 3]] = true;
      }
      const result = [];
      for (let n = 1; n <= 9; n++) {
        if (!used[n]) result.push(n);
      }
      return result;
    }

    // Counts solutions up to `limit`. Leaves the grid solved when it stops at the limit.
    function solve(grid, limit, randomize) {
      let best = -1;
      let bestCandidates = null;
      for (let i = 0; i < 81; i++) {
        if (grid[i]) continue;
        const c = candidates(grid, i);
        if (c.length === 0) return 0;
        if (!bestCandidates || c.length < bestCandidates.length) {
          best = i;
          bestCandidates = c;
          if (c.length === 1) break;
        }
      }
      if (best === -1) return 1;
      if (randomize) shuffle(bestCandidates);

      let count = 0;
      for (const n of bestCandidates) {
        grid[best] = n;
        count += solve(grid, limit - count, randomize);
        if (count >= limit) return count;
      }
      grid[best] = 0;
      return count;
    }

    // One attempt: remove numbers one by one (keeping exactly one solution) and
    // rate the puzzle along the way. Returns the version closest to `level`.
    function attempt(level) {
      const full = new Array(81).fill(0);
      solve(full, 1, true);

      const grid = full.slice();
      let filled = 81;
      let best = null;
      for (const i of shuffle([...Array(81).keys()])) {
        const kept = grid[i];
        grid[i] = 0;
        if (solve(grid.slice(), 2, false) !== 1) {
          grid[i] = kept;
          continue;
        }
        filled--;
        if (filled > MAX_RATED_GIVENS) continue;

        const found = levelOf(rate(grid), filled);
        if (!best || Math.abs(found - level) < Math.abs(best.level - level)) {
          best = { puzzle: grid.slice(), solution: full, level: found };
        }
        // Removing more numbers (almost) never makes it easier, so stop here
        if (found >= level) break;
      }
      return best;
    }

    // ---------- Difficulty ----------
    // Solves the puzzle the way a person would, with candidate bitmasks
    // (bit n set = n is still possible). The hardest technique needed
    // decides how difficult the puzzle is.

    const ROWS = [...Array(9)].map((_, r) => [...Array(9)].map((_, k) => r * 9 + k));
    const COLS = [...Array(9)].map((_, c) => [...Array(9)].map((_, k) => k * 9 + c));
    const BOXES = [...Array(9)].map((_, b) => [...Array(9)].map((_, k) =>
      (Math.floor(b / 3) * 3 + Math.floor(k / 3)) * 9 + (b % 3) * 3 + k % 3));
    const UNITS = [...ROWS, ...COLS, ...BOXES];
    const PEERS = [...Array(81)].map((_, i) => [...Array(81).keys()].filter(j => isPeer(i, j)));

    // Tier 8 means: these techniques are not enough, you need chains or guessing
    const STUCK = 8;
    const TECHNIQUES = [
      { tier: 1, apply: nakedSingle },
      { tier: 2, apply: hiddenSingle },
      { tier: 3, apply: lockedCandidates },
      { tier: 4, apply: s => nakedSubset(s, 2) },
      { tier: 4, apply: s => hiddenSubset(s, 2) },
      { tier: 5, apply: s => nakedSubset(s, 3) },
      { tier: 5, apply: s => hiddenSubset(s, 3) },
      { tier: 6, apply: s => fish(s, 2) },  // X-Wing
      { tier: 7, apply: xyWing },
      { tier: 7, apply: s => fish(s, 3) },  // Swordfish
    ];

    function bitCount(mask) {
      let count = 0;
      for (; mask; mask &= mask - 1) count++;
      return count;
    }

    function digitsOf(mask) {
      const digits = [];
      for (let n = 1; n <= 9; n++) {
        if (mask & (1 << n)) digits.push(n);
      }
      return digits;
    }

    function combinations(items, k, start = 0, combo = [], out = []) {
      if (combo.length === k) {
        out.push(combo.slice());
        return out;
      }
      for (let i = start; i < items.length; i++) {
        combo.push(items[i]);
        combinations(items, k, i + 1, combo, out);
        combo.pop();
      }
      return out;
    }

    function place(s, i, n) {
      s.grid[i] = n;
      s.cand[i] = 0;
      for (const p of PEERS[i]) s.cand[p] &= ~(1 << n);
    }

    function eliminate(s, cells, mask) {
      let changed = false;
      for (const i of cells) {
        if (s.cand[i] & mask) {
          s.cand[i] &= ~mask;
          changed = true;
        }
      }
      return changed;
    }

    // Each technique changes the state and returns what it did
    // ({ name, text, pattern: cells involved }), or null if it doesn't apply.

    function unitName(unit) {
      const k = UNITS.indexOf(unit);
      return k < 9 ? `row ${k + 1}` : k < 18 ? `column ${k - 8}` : `box ${k - 17}`;
    }

    function listText(items) {
      if (items.length <= 2) return items.join(" and ");
      return `${items.slice(0, -1).join(", ")}, and ${items[items.length - 1]}`;
    }

    // A cell with only one possible number
    function nakedSingle(s) {
      for (let i = 0; i < 81; i++) {
        if (bitCount(s.cand[i]) === 1) {
          const n = digitsOf(s.cand[i])[0];
          place(s, i, n);
          return { name: "Naked single", text: `Only a ${n} still fits in this cell.`, pattern: [i] };
        }
      }
      return null;
    }

    // A number that fits in only one cell of a row, column or box
    function hiddenSingle(s) {
      for (const unit of UNITS) {
        for (let n = 1; n <= 9; n++) {
          const spots = unit.filter(i => s.cand[i] & (1 << n));
          if (spots.length === 1) {
            place(s, spots[0], n);
            return { name: "Hidden single", text: `In ${unitName(unit)}, the ${n} only fits here.`, pattern: unit };
          }
        }
      }
      return null;
    }

    // Pointing pairs and box-line reduction: a number confined to the
    // overlap of a box and a line can be removed from the rest of both
    function lockedCandidates(s) {
      for (let n = 1; n <= 9; n++) {
        const bit = 1 << n;
        for (const unit of UNITS) {
          const spots = unit.filter(i => s.cand[i] & bit);
          if (spots.length < 2) continue;
          for (const other of UNITS) {
            if (other === unit || !spots.every(i => other.includes(i))) continue;
            if (eliminate(s, other.filter(i => !unit.includes(i)), bit)) {
              return {
                name: UNITS.indexOf(unit) >= 18 ? "Pointing pair" : "Box-line reduction",
                text: `In ${unitName(unit)}, the ${n} only fits in these cells, and they all sit in ` +
                  `${unitName(other)}. So the ${n} can go from the rest of ${unitName(other)}.`,
                pattern: spots,
              };
            }
          }
        }
      }
      return null;
    }

    // k cells in a unit that together hold only k numbers
    function nakedSubset(s, k) {
      for (const unit of UNITS) {
        const open = unit.filter(i => s.cand[i] && bitCount(s.cand[i]) <= k);
        for (const combo of combinations(open, k)) {
          const mask = combo.reduce((m, i) => m | s.cand[i], 0);
          if (bitCount(mask) !== k) continue;
          if (eliminate(s, unit.filter(i => !combo.includes(i)), mask)) {
            const digits = listText(digitsOf(mask));
            return {
              name: k === 2 ? "Naked pair" : "Naked triple",
              text: `These ${k} cells in ${unitName(unit)} can only hold ${digits} between them. ` +
                `So ${digits} can go from the rest of ${unitName(unit)}.`,
              pattern: combo,
            };
          }
        }
      }
      return null;
    }

    // k numbers in a unit that only fit in the same k cells
    function hiddenSubset(s, k) {
      for (const unit of UNITS) {
        const digits = [];
        const spots = {};
        for (let n = 1; n <= 9; n++) {
          spots[n] = unit.filter(i => s.cand[i] & (1 << n));
          if (spots[n].length >= 2 && spots[n].length <= k) digits.push(n);
        }
        for (const combo of combinations(digits, k)) {
          const cells = new Set(combo.flatMap(n => spots[n]));
          if (cells.size !== k) continue;
          const keep = combo.reduce((m, n) => m | (1 << n), 0);
          if (eliminate(s, cells, ~keep)) {
            return {
              name: k === 2 ? "Hidden pair" : "Hidden triple",
              text: `In ${unitName(unit)}, ${listText(combo)} only fit in these ${k} cells. ` +
                `Every other number in those cells can go.`,
              pattern: [...cells],
            };
          }
        }
      }
      return null;
    }

    // X-Wing (size 2) and Swordfish (size 3)
    function fish(s, size) {
      const orientations = [
        [ROWS, COLS, col, row, "rows", "columns"],
        [COLS, ROWS, row, col, "columns", "rows"],
      ];
      for (let n = 1; n <= 9; n++) {
        const bit = 1 << n;
        for (const [bases, covers, coverOf, baseOf, baseWord, coverWord] of orientations) {
          const lines = [];
          bases.forEach((unit, index) => {
            const positions = unit.filter(i => s.cand[i] & bit).map(coverOf);
            if (positions.length >= 2 && positions.length <= size) lines.push({ index, positions });
          });
          for (const combo of combinations(lines, size)) {
            const coverIndexes = new Set(combo.flatMap(l => l.positions));
            if (coverIndexes.size !== size) continue;
            const baseIndexes = combo.map(l => l.index);
            const targets = [...coverIndexes].flatMap(c => covers[c])
              .filter(i => !baseIndexes.includes(baseOf(i)));
            if (eliminate(s, targets, bit)) {
              const coverList = [...coverIndexes].sort().map(c => c + 1);
              return {
                name: `${size === 2 ? "X-Wing" : "Swordfish"} on ${n}`,
                text: `In ${baseWord} ${listText(baseIndexes.map(b => b + 1))}, the ${n} only fits in ` +
                  `${coverWord} ${listText(coverList)}. Wherever it lands, those ${coverWord} ` +
                  `get their ${n} there. So the ${n} can go from the rest of those ${coverWord}.`,
                pattern: baseIndexes.flatMap(b => bases[b]).filter(i => s.cand[i] & bit),
              };
            }
          }
        }
      }
      return null;
    }

    // Pivot {a,b} sees wings {a,c} and {b,c}: c is gone from cells that see both wings
    function xyWing(s) {
      const pairs = [...Array(81).keys()].filter(i => bitCount(s.cand[i]) === 2);
      for (const pivot of pairs) {
        const [a, b] = digitsOf(s.cand[pivot]);
        const wings = pairs.filter(w => isPeer(pivot, w));
        for (const w1 of wings) {
          if (!(s.cand[w1] & (1 << a)) || (s.cand[w1] & (1 << b))) continue;
          const c = digitsOf(s.cand[w1] & ~(1 << a))[0];
          const wantedW2 = (1 << b) | (1 << c);
          for (const w2 of wings) {
            if (s.cand[w2] !== wantedW2) continue;
            const targets = PEERS[w1].filter(i => i !== w2 && isPeer(i, w2));
            if (eliminate(s, targets, 1 << c)) {
              return {
                name: "XY-Wing",
                text: `The middle cell is a ${a} or a ${b}. If it's a ${a}, one wing becomes a ${c}; ` +
                  `if it's a ${b}, the other one does. So cells that see both wings can't be a ${c}.`,
                pattern: [pivot, w1, w2],
              };
            }
          }
        }
      }
      return null;
    }

    function candidateMasks(grid) {
      return grid.map((v, i) => v ? 0 : candidates(grid, i).reduce((m, n) => m | (1 << n), 0));
    }

    // Applies the easiest technique that works, or returns null when none does
    function nextStep(s) {
      for (const technique of TECHNIQUES) {
        const step = technique.apply(s);
        if (step) return { ...step, tier: technique.tier };
      }
      return null;
    }

    function rate(puzzleGrid) {
      const s = { grid: puzzleGrid.slice(), cand: candidateMasks(puzzleGrid) };
      let tier = 0;
      while (s.grid.includes(0)) {
        const step = nextStep(s);
        if (!step) return { tier: STUCK, empty: s.grid.filter(v => !v).length };
        tier = Math.max(tier, step.tier);
      }
      return { tier, empty: 0 };
    }

    // Maps a rating to the 1-10 scale. Levels 7-10: the more empty cells
    // left when the techniques run out, the harder the puzzle.
    function levelOf({ tier, empty }, givens) {
      if (tier <= 2) return givens > 34 ? 1 : givens > 30 ? 2 : 3;
      if (tier === 3) return 4;
      if (tier === 4) return 5;
      if (tier < STUCK) return 6;
      return empty < 30 ? 7 : empty < 38 ? 8 : empty < 46 ? 9 : 10;
    }

    // ---------- Game ----------

    // Generating can take a second or more for some levels, so it runs in
    // small chunks: one attempt per tick, keeping the page responsive.
    function startJob(level) {
      const job = { level, result: null, done: false, onDone: null, cancelled: false };
      const startedAt = Date.now();
      function step() {
        if (job.cancelled) return;
        const result = attempt(level);
        if (!job.result || Math.abs(result.level - level) < Math.abs(job.result.level - level)) {
          job.result = result;
        }
        if (job.result.level === level || Date.now() - startedAt > GENERATE_BUDGET) {
          job.done = true;
          if (job.onDone) job.onDone(job.result);
        } else {
          setTimeout(step, 20);
        }
      }
      setTimeout(step, 20);
      return job;
    }

    let nextJob = null;     // next puzzle, prepared in the background while you play
    let waitingJob = null;  // puzzle we are waiting for right now
    let nextGameTimer = null;
    let solveTimer = null;  // runs while "Los op" is solving
    let marks = { pattern: new Set(), target: new Set(), removed: {} }; // highlights of the last step

    function chosenLevel() {
      return Number(difficultyEl.value);
    }

    function newGame() {
      clearTimeout(nextGameTimer);
      stopAutoSolve();
      if (waitingJob) waitingJob.cancelled = true;

      const level = chosenLevel();
      let job = nextJob && nextJob.level === level ? nextJob : null;
      if (nextJob && !job) nextJob.cancelled = true;
      nextJob = null;
      if (!job) job = startJob(level);

      if (job.done) {
        startGame(job.result);
      } else {
        waitingJob = job;
        job.onDone = startGame;
        locked = true;
        selected = null;
        overlayEl.innerHTML = `<span class="loader"><i></i><i></i><i></i></span>` +
          `<span class="meta">building a level ${level} puzzle</span>`;
        overlayEl.classList.add("show");
      }
    }

    function startGame(result) {
      waitingJob = null;
      ({ puzzle, solution } = result);
      document.getElementById("level").textContent = result.level;
      values = puzzle.slice();
      notes = values.map(() => new Set());
      hinted = new Set();
      selected = null;
      locked = false;
      hints = 0;
      startTime = Date.now();
      overlayEl.classList.remove("show");
      messageEl.textContent = "";
      clearMarks();
      render();
      nextJob = startJob(chosenLevel());
    }

    function select(i) {
      if (locked) return;
      selected = i;
      render();
    }

    function enter(n) {
      if (locked || selected === null || puzzle[selected]) return;
      stopAutoSolve();
      clearMarks();
      messageEl.textContent = "";

      if (notesMode && !values[selected]) {
        const cellNotes = notes[selected];
        cellNotes.has(n) ? cellNotes.delete(n) : cellNotes.add(n);
      } else {
        values[selected] = values[selected] === n ? 0 : n;
        notes[selected].clear();
        hinted.delete(selected);
        if (values[selected] === solution[selected]) clearNotesAround(selected, n);
      }
      render();
      checkSolved();
    }

    function erase() {
      if (locked || selected === null || puzzle[selected]) return;
      stopAutoSolve();
      clearMarks();
      values[selected] = 0;
      notes[selected].clear();
      hinted.delete(selected);
      render();
    }

    function say(label, text) {
      messageEl.innerHTML = `<span class="eyebrow">${label}</span>${text}`;
    }

    function clearNotesAround(i, n) {
      for (let j = 0; j < 81; j++) {
        if (isPeer(i, j)) notes[j].delete(n);
      }
    }

    function hint() {
      if (locked) return;
      stopAutoSolve();
      clearMarks();
      const wrong = [];
      const empty = [];
      for (let i = 0; i < 81; i++) {
        if (values[i] && values[i] !== solution[i]) wrong.push(i);
        if (!values[i]) empty.push(i);
      }

      let target;
      if (wrong.length) {
        // First point out a mistake, otherwise the rest can't be solved
        target = wrong.includes(selected) ? selected : wrong[0];
        say("hint", `This cell was wrong. It's a ${solution[target]}.`);
      } else if (selected !== null && !values[selected]) {
        target = selected;
        say("hint", `This cell is a ${solution[target]}.`);
      } else {
        // Pick the empty cell with the fewest options: the easiest next step
        target = empty.reduce((a, b) =>
          candidates(values, b).length < candidates(values, a).length ? b : a);
        const onlyOption = candidates(values, target).length === 1;
        say("hint", onlyOption
          ? `Only a ${solution[target]} fits in this cell.`
          : `This cell is a ${solution[target]}.`);
      }

      values[target] = solution[target];
      notes[target].clear();
      clearNotesAround(target, solution[target]);
      hinted.add(target);
      hints++;
      selected = target;
      render();
      flash(target);
      checkSolved();
    }

    // ---------- Step & solve ----------

    function clearMarks() {
      marks = { pattern: new Set(), target: new Set(), removed: {} };
    }

    function stopAutoSolve() {
      clearInterval(solveTimer);
      solveTimer = null;
      solveBtn.textContent = "solve";
      solveBtn.classList.remove("on");
    }

    function toggleAutoSolve() {
      if (solveTimer) return stopAutoSolve();
      if (locked) return;
      solveBtn.textContent = "stop";
      solveBtn.classList.add("on");
      solverStep();
      solveTimer = setInterval(solverStep, 700);
    }

    function manualStep() {
      if (locked) return;
      stopAutoSolve();
      solverStep();
    }

    // One logical step, explained. Works on your notes, so you can follow
    // which numbers are removed.
    function solverStep() {
      if (locked) return stopAutoSolve();
      clearMarks();
      const empty = [...Array(81).keys()].filter(i => !values[i]);

      // A wrong number would make every deduction after it wrong, so fix that first
      const wrong = values.findIndex((v, i) => v && v !== solution[i]);
      if (wrong !== -1) {
        values[wrong] = solution[wrong];
        notes[wrong].clear();
        clearNotesAround(wrong, solution[wrong]);
        hinted.add(wrong);
        return showStep("fix", `This cell was wrong. It's a ${solution[wrong]}.`, [wrong], true);
      }

      // The techniques work with notes, so every empty cell needs them
      if (empty.some(i => notes[i].size === 0)) {
        for (const i of empty) {
          if (!notes[i].size) notes[i] = new Set(candidates(values, i));
        }
        return showStep("notes", "Every possible number is now a note. Press step again.", [], false);
      }

      const crossedOut = empty.find(i => !notes[i].has(solution[i]));
      if (crossedOut !== undefined) {
        notes[crossedOut].add(solution[crossedOut]);
        return showStep("fix", `The ${solution[crossedOut]} was crossed out here, but it fits. It's back.`,
          [crossedOut], true);
      }

      // Your notes, minus numbers that already appear in the same row, column or box
      const possible = candidateMasks(values);
      const s = {
        grid: values.slice(),
        cand: values.map((v, i) => [...notes[i]].reduce((m, n) => m | (1 << n), 0) & possible[i]),
      };
      const before = s.cand.slice();
      let label, text;
      const step = nextStep(s);
      if (step) {
        label = step.name.toLowerCase();
        text = step.text;
        step.pattern.forEach(i => marks.pattern.add(i));
      } else {
        const i = empty.reduce((a, b) => bitCount(s.cand[b]) < bitCount(s.cand[a]) ? b : a);
        place(s, i, solution[i]);
        label = "no technique";
        text = `No technique applies here; it takes chains or trial and error. This cell is a ${solution[i]}.`;
      }

      // Copy the result back to the board
      const placed = empty.filter(i => s.grid[i]);
      for (const i of empty) {
        if (s.grid[i]) {
          values[i] = s.grid[i];
          hinted.add(i);
        }
        notes[i] = new Set(digitsOf(s.cand[i]));
        if (!placed.length) {
          const gone = digitsOf(before[i] & ~s.cand[i]);
          if (gone.length) marks.removed[i] = gone;
        }
      }
      const targets = placed.length ? placed : Object.keys(marks.removed).map(Number);
      showStep(label, text, targets, true);
    }

    function showStep(label, text, targets, counts) {
      targets.forEach(i => marks.target.add(i));
      if (counts) hints++;
      say(`step \\ ${label}`, text);
      selected = null;
      render();
      checkSolved();
    }

    function checkSolved() {
      if (!values.every((v, i) => v === solution[i])) return;
      locked = true;
      if (solveTimer) {
        // Solved by "Los op": keep the board visible and don't count it
        stopAutoSolve();
        say("solver \\ done", "The solver finished this one. Press skip for a new puzzle.");
        render();
        return;
      }
      solvedCount++;
      localStorage.setItem("sudokuSolved", solvedCount);
      const hintText = hints === 0 ? "no hints" : `${hints} ${hints === 1 ? "hint" : "hints"}`;
      overlayEl.innerHTML =
        `<strong>Solved in ${formatTime(Date.now() - startTime)}</strong>` +
        `<span class="meta">level ${document.getElementById("level").textContent} \\ ${hintText} \\ next puzzle loading</span>`;
      overlayEl.classList.add("show");
      selected = null;
      render();
      nextGameTimer = setTimeout(newGame, NEXT_PUZZLE_DELAY);
    }

    // ---------- Rendering ----------

    const cells = [];
    for (let i = 0; i < 81; i++) {
      const cell = document.createElement("div");
      cell.className = "cell";
      cell.addEventListener("click", () => select(i));
      boardEl.insertBefore(cell, overlayEl);
      cells.push(cell);
    }

    for (let n = 1; n <= 9; n++) {
      const button = document.createElement("button");
      button.textContent = n;
      button.addEventListener("click", () => enter(n));
      padEl.appendChild(button);
    }

    function render() {
      if (!values) return; // first puzzle is still being made
      const selectedValue = selected !== null ? values[selected] : 0;

      cells.forEach((cell, i) => {
        const v = values[i];
        cell.className = "cell";
        if (col(i) % 3 === 2 && col(i) !== 8) cell.classList.add("br");
        if (row(i) % 3 === 2 && row(i) !== 8) cell.classList.add("bb");
        if (puzzle[i]) cell.classList.add("given");
        if (hinted.has(i)) cell.classList.add("hinted");
        if (v && v !== solution[i]) cell.classList.add("wrong");
        if (selected !== null && isPeer(i, selected)) cell.classList.add("peer");
        if (selectedValue && v === selectedValue) cell.classList.add("same");
        if (i === selected) cell.classList.add("selected");
        if (marks.pattern.has(i)) cell.classList.add("pattern");
        if (marks.target.has(i)) cell.classList.add("target");

        const removed = marks.removed[i] || [];
        if (v) {
          cell.textContent = v;
        } else if (notes[i].size || removed.length) {
          let html = '<div class="notes">';
          for (let n = 1; n <= 9; n++) {
            if (notes[i].has(n)) html += `<span>${n}</span>`;
            else if (removed.includes(n)) html += `<span class="gone">${n}</span>`;
            else html += "<span></span>";
          }
          cell.innerHTML = html + "</div>";
        } else {
          cell.textContent = "";
        }
      });

      // Dim the numbers that are already placed correctly 9 times
      [...padEl.children].forEach((button, k) => {
        const placed = values.filter((v, i) => v === k + 1 && v === solution[i]).length;
        button.classList.toggle("done", placed === 9);
      });

      document.getElementById("hints").textContent = hints;
      document.getElementById("solved").textContent = solvedCount;
      notesBtn.classList.toggle("on", notesMode);
    }

    function flash(i) {
      cells[i].classList.remove("flash");
      void cells[i].offsetWidth; // restart the animation
      cells[i].classList.add("flash");
    }

    function formatTime(ms) {
      const s = Math.floor(ms / 1000);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    }

    setInterval(() => {
      if (!locked) document.getElementById("time").textContent = formatTime(Date.now() - startTime);
    }, 250);

    // ---------- Controls ----------

    notesBtn.addEventListener("click", () => { notesMode = !notesMode; render(); });
    document.getElementById("eraseBtn").addEventListener("click", erase);
    document.getElementById("hintBtn").addEventListener("click", hint);
    document.getElementById("stepBtn").addEventListener("click", manualStep);
    solveBtn.addEventListener("click", toggleAutoSolve);
    document.getElementById("skipBtn").addEventListener("click", newGame);
    difficultyEl.value = localStorage.getItem("sudokuLevel") || "5";
    difficultyEl.addEventListener("change", () => {
      difficultyEl.blur();
      localStorage.setItem("sudokuLevel", difficultyEl.value);
      newGame();
    });

    window.addEventListener("keydown", (e) => {
      if (e.key >= "1" && e.key <= "9") {
        enter(Number(e.key));
      } else if (e.key === "Backspace" || e.key === "Delete" || e.key === "0") {
        erase();
      } else if (e.key.toLowerCase() === "n") {
        notesMode = !notesMode;
        render();
      } else if (e.key.toLowerCase() === "t") {
        hint();
      } else if (e.key.toLowerCase() === "s") {
        manualStep();
      } else if (e.key.startsWith("Arrow")) {
        e.preventDefault();
        const moves = { ArrowUp: -9, ArrowDown: 9, ArrowLeft: -1, ArrowRight: 1 };
        if (selected === null) return select(0);
        const next = selected + moves[e.key];
        const sameRow = row(next) === row(selected);
        if (next >= 0 && next < 81 && (Math.abs(moves[e.key]) === 9 || sameRow)) select(next);
      }
    });

    newGame();
  </script>
</body>
</html>
