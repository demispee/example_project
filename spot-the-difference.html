<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spot the difference \ LAB271</title>
  <style>
    /* Lab271 design system, dark theme. TT Interphases is licensed via Schuberg Philis
       and loads from a local fonts/ folder that is not shared; elsewhere the fallbacks apply. */
    @font-face { font-family: "TT Interphases"; src: local("TT Interphases"), url("fonts/TTInterphases-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "TT Interphases"; src: local("TT Interphases Bold"), url("fonts/TTInterphases-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "TT Interphases"; src: local("TT Interphases Black"), url("fonts/TTInterphases-Black.ttf") format("truetype"); font-weight: 900; font-display: swap; }
    @font-face { font-family: "TT Interphases Mono"; src: local("TT Interphases Mono"), url("fonts/TTInterphasesMono-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "TT Interphases Mono"; src: local("TT Interphases Mono Bold"), url("fonts/TTInterphasesMono-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
    :root {
      --c-canvas: #020C17;
      --c-canvas-2: #061323;
      --c-panel: #082646;
      --c-text: #FFFFFF;
      --c-muted: #8AA0B8;
      --c-border: #12263F;
      --c-tq: #1EE8ED;
      --c-orange: #FF8D33;
      --c-magenta: #FF0089;
      --sans: "TT Interphases", "Avenir Next", "Poppins", "Inter", sans-serif;
      --mono: "TT Interphases Mono", "Courier New", monospace;
      --angle-slash: 14deg;
      --motion: 200ms cubic-bezier(.2, 0, .2, 1);
    }

    html, body {
      margin: 0;
      min-height: 100%;
      background: var(--c-canvas);
      color: var(--c-text);
      font-family: var(--sans);
      font-size: 16px;
      line-height: 1.5;
      -webkit-font-smoothing: antialiased;
    }
    body { overflow-x: hidden; }
    main {
      position: relative;
      max-width: 1180px;
      margin: 0 auto;
      padding: 56px 40px 0;
      user-select: none;
    }

    /* The one device: the refracted slash, bleeding off the top right */
    .slash {
      position: absolute;
      top: -90px;
      right: 40px;
      display: flex;
      gap: 31px;
      pointer-events: none;
    }
    .slash span {
      display: block;
      height: 240px;
      transform: skewX(var(--angle-slash));
    }
    .slash .tq { width: 44px; border-radius: 8px; background: var(--c-tq); }
    .slash .or { width: 19px; border-radius: 4px; background: var(--c-orange); }

    .back {
      display: inline-flex;
      align-items: center;
      height: 32px;
      margin-bottom: 28px;
      padding: 0 16px;
      border: 1px solid var(--c-border);
      border-radius: 999px;
      color: var(--c-muted);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: color var(--motion), border-color var(--motion);
    }
    .back:hover { color: var(--c-tq); border-color: var(--c-tq); }

    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--c-tq);
    }
    h1 {
      margin: 10px 0 40px;
      max-width: 760px;
      font-size: clamp(40px, 5vw, 68px);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.09;
    }

    .bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 8px;
      margin-bottom: 20px;
    }
    .label {
      display: inline-flex;
      align-items: center;
      height: 28px;
      padding: 0 14px;
      border-radius: 999px 999px 999px 0;
      background: var(--c-panel);
      color: var(--c-tq);
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      white-space: nowrap;
    }
    .label.scene { background: transparent; border: 1px solid var(--c-border); color: var(--c-muted); }
    select {
      height: 44px;
      padding: 0 16px;
      border: 1px solid var(--c-border);
      border-radius: 10px 10px 10px 0;
      background: var(--c-canvas);
      color: var(--c-text);
      font-family: var(--mono);
      font-size: 13px;
      cursor: pointer;
    }

    #pictures {
      position: relative;
      display: flex;
      flex-wrap: wrap;
      gap: 16px;
      margin-bottom: 20px;
    }
    .picture {
      position: relative;
      width: calc(50% - 8px);
      box-sizing: border-box;
      aspect-ratio: 4 / 3;
      border: 2px solid var(--c-muted);
      border-radius: 12px 12px 12px 0;
      overflow: hidden;
      background: var(--c-canvas-2);
      cursor: crosshair;
    }
    .picture svg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .marks { pointer-events: none; }
    .found {
      fill: none;
      stroke: var(--c-tq);
      stroke-width: 5;
      filter: drop-shadow(0 0 4px #000);
      animation: pop 0.35s cubic-bezier(.2, 0, .2, 1);
      transform-box: fill-box;
      transform-origin: center;
    }
    @keyframes pop {
      from { transform: scale(1.6); opacity: 0; }
    }
    .miss {
      stroke: var(--c-magenta);
      stroke-width: 6;
      stroke-linecap: round;
      animation: fade 0.8s ease-out forwards;
    }
    @keyframes fade {
      to { opacity: 0; }
    }
    .penalty {
      fill: var(--c-magenta);
      font: bold 22px var(--mono);
      animation: fade 0.9s ease-out forwards;
    }
    .hintmark {
      fill: none;
      stroke: var(--c-orange);
      stroke-width: 4;
      stroke-dasharray: 10 8;
      animation: pulse 0.8s ease-in-out infinite alternate;
    }
    @keyframes pulse {
      to { stroke-opacity: 0.25; }
    }
    .revealed {
      fill: none;
      stroke: var(--c-magenta);
      stroke-width: 5;
      stroke-dasharray: 12 8;
      filter: drop-shadow(0 0 4px #000);
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: none;
      flex-direction: column;
      align-items: flex-start;
      justify-content: flex-end;
      gap: 8px;
      padding: 32px;
      box-sizing: border-box;
      border-radius: 12px 12px 12px 0;
      background: color-mix(in srgb, var(--c-canvas) 90%, transparent);
    }
    #overlay.show { display: flex; }
    #overlay strong {
      font-size: clamp(32px, 6vw, 48px);
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.09;
    }
    #overlay .meta {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      color: var(--c-muted);
    }

    .btn {
      height: 44px;
      padding: 0 22px;
      border: 1px solid var(--c-tq);
      border-radius: 999px;
      background: transparent;
      color: var(--c-tq);
      font-family: var(--mono);
      font-size: 13px;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: opacity var(--motion), background-color var(--motion), color var(--motion);
    }
    .btn:hover { opacity: 0.82; }
    .btn.primary { background: var(--c-tq); color: var(--c-canvas); }
    button:active { transform: scale(0.98); }
    button:focus-visible, select:focus-visible, a:focus-visible {
      outline: 2px solid var(--c-tq);
      outline-offset: 2px;
    }

    #message {
      max-width: 640px;
      margin-bottom: 20px;
      padding: 16px 22px;
      border: 1px solid var(--c-border);
      border-radius: 20px 20px 20px 0;
      background: var(--c-canvas-2);
      font-size: 15px;
    }
    #message:empty { display: none; }

    .help {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      line-height: 2;
      color: var(--c-muted);
    }
    .bs { color: var(--c-tq); }

    footer {
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-top: 64px;
      padding: 18px 0 22px;
      border-top: 1px solid rgba(255, 255, 255, 0.16);
      font-family: var(--mono);
      font-size: 12px;
      color: var(--c-muted);
    }
    footer svg { height: 32px; width: auto; display: block; }

    @media (max-width: 760px) {
      .picture { width: 100%; }
    }
    @media (max-width: 640px) {
      main { padding: 40px 20px 0; }
      .slash { right: 16px; transform: scale(0.6); transform-origin: top right; }
    }
  </style>
</head>
<body>
  <div class="slash" aria-hidden="true"><span class="tq"></span><span class="or"></span></div>
  <main>
    <a class="back" href="index.html">← back</a>
    <div class="eyebrow">LAB271 \ spot the difference</div>
    <h1>Every detail counts</h1>

    <div class="bar">
      <select id="count" title="Number of differences">
        <option value="5">5 differences \ easy</option>
        <option value="7">7 differences \ normal</option>
        <option value="10">10 differences \ hard</option>
      </select>
      <span class="label scene" id="sceneName"></span>
    </div>

    <div class="bar">
      <span class="label">found \&nbsp;<span id="found">0</span>&nbsp;/&nbsp;<span id="total">0</span></span>
      <span class="label">time \&nbsp;<span id="time">0:00</span></span>
      <span class="label">misses \&nbsp;<span id="misses">0</span></span>
      <span class="label">hints \&nbsp;<span id="hints">0</span></span>
      <span class="label">record \&nbsp;<span id="record">–</span></span>
      <span class="label">solved \&nbsp;<span id="solved">0</span></span>
    </div>

    <div id="pictures">
      <div class="picture"></div>
      <div class="picture"></div>
      <div id="overlay"></div>
    </div>

    <div class="bar">
      <button class="btn primary" id="hintBtn">hint</button>
      <button class="btn" id="revealBtn">show solution</button>
      <button class="btn" id="skipBtn">next</button>
    </div>

    <div id="message">Click a difference in either picture.</div>

    <div class="help">
      a wrong click costs 5 seconds <span class="bs">\</span> a hint costs 10 seconds<br>
      h <span class="bs">\</span> hint &nbsp; s <span class="bs">\</span> show solution &nbsp; n <span class="bs">\</span> next picture
    </div>

    <footer>
      <div>LAB271 <span class="bs">\</span> a Schuberg Philis lab</div>

  <script>
    const CLICK_MARGIN = 12;  // extra room around a difference, in picture units
    const NEXT_ROUND_DELAY = 3500;
    const MISS_PENALTY = 5000;  // ms added to your time for a wrong click
    const HINT_PENALTY = 10000; // ms added to your time for a hint

    // ---------- Drawing helpers ----------
    // Pictures are SVG strings in an 800x600 coordinate system. Everything
    // random uses a seeded generator, so both pictures come out identical
    // except for the differences.

    function seeded(seed) {
      return () => {
        seed = (seed + 0x6d2b79f5) | 0;
        let t = Math.imul(seed ^ (seed >>> 15), 1 | seed);
        t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
        return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
      };
    }

    function rotatePoint(x, y, cx, cy, degrees) {
      const a = degrees * Math.PI / 180;
      const dx = x - cx, dy = y - cy;
      return [cx + dx * Math.cos(a) - dy * Math.sin(a), cy + dx * Math.sin(a) + dy * Math.cos(a)];
    }

    function starPath(cx, cy, outer, inner, points) {
      let d = "";
      for (let k = 0; k < points * 2; k++) {
        const r = k % 2 ? inner : outer;
        const a = Math.PI * k / points - Math.PI / 2;
        d += `${k ? "L" : "M"}${(cx + r * Math.cos(a)).toFixed(1)},${(cy + r * Math.sin(a)).toFixed(1)}`;
      }
      return d + "Z";
    }

    function star(cx, cy, outer, inner, points, fill, extra = "") {
      return `<path d="${starPath(cx, cy, outer, inner, points)}" fill="${fill}" ${extra}/>`;
    }

    function sparkle(cx, cy, size, color = "#fffbe8") {
      return star(cx, cy, size, size * 0.22, 4, color, 'filter="url(#glow)"');
    }

    // Brilliant-cut gem seen from the side; (cx, cy) is the widest point
    function diamond(cx, cy, w, fill) {
      const crown = w * 0.28, pavilion = w * 0.6, table = w / 3, mid = w / 6;
      const left = cx - w / 2, right = cx + w / 2;
      return `<g stroke="#fff" stroke-opacity="0.75" stroke-width="1" stroke-linejoin="round">
        <path d="M${left},${cy} L${cx - table},${cy - crown} L${cx + table},${cy - crown} L${right},${cy} L${cx},${cy + pavilion} Z" fill="${fill}"/>
        <path fill="none" d="M${left},${cy} L${right},${cy}
          M${cx - table},${cy - crown} L${cx - mid},${cy} L${cx},${cy - crown} L${cx + mid},${cy} L${cx + table},${cy - crown}
          M${left},${cy} L${cx},${cy + pavilion} M${cx - mid},${cy} L${cx},${cy + pavilion}
          M${cx + mid},${cy} L${cx},${cy + pavilion} M${right},${cy} L${cx},${cy + pavilion}"/>
      </g>`;
    }

    function pearl(cx, cy, r, fill = "url(#pearl)") {
      return `<circle cx="${cx.toFixed(1)}" cy="${cy.toFixed(1)}" r="${r}" fill="${fill}"/>`;
    }

    function quadPoint(p0, p1, p2, t) {
      const u = 1 - t;
      return [u * u * p0[0] + 2 * u * t * p1[0] + t * t * p2[0], u * u * p0[1] + 2 * u * t * p1[1] + t * t * p2[1]];
    }

    // Gradients shared by all scenes
    const SHARED_DEFS = `
      <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#fff1b8"/><stop offset="0.45" stop-color="#e2b54a"/><stop offset="1" stop-color="#8c6418"/>
      </linearGradient>
      <radialGradient id="pearl" cx="35%" cy="30%" r="70%">
        <stop offset="0" stop-color="#ffffff"/><stop offset="0.6" stop-color="#efe6d6"/><stop offset="1" stop-color="#a99d88"/>
      </radialGradient>
      <radialGradient id="goldPearl" cx="35%" cy="30%" r="70%">
        <stop offset="0" stop-color="#fff6cf"/><stop offset="0.6" stop-color="#e2b54a"/><stop offset="1" stop-color="#8c6418"/>
      </radialGradient>
      <linearGradient id="gemWhite" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffffff"/><stop offset="0.5" stop-color="#cfe9ff"/><stop offset="1" stop-color="#7fa8dc"/>
      </linearGradient>
      <linearGradient id="gemPink" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ffe0ee"/><stop offset="0.5" stop-color="#ff79b4"/><stop offset="1" stop-color="#b8145f"/>
      </linearGradient>
      <linearGradient id="gemRuby" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#ff8a9a"/><stop offset="0.5" stop-color="#d10f3a"/><stop offset="1" stop-color="#6e0018"/>
      </linearGradient>
      <linearGradient id="gemEmerald" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#9dffcf"/><stop offset="0.5" stop-color="#14a866"/><stop offset="1" stop-color="#05502e"/>
      </linearGradient>
      <linearGradient id="gemSapphire" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" stop-color="#a9c8ff"/><stop offset="0.5" stop-color="#2156d6"/><stop offset="1" stop-color="#0a2366"/>
      </linearGradient>
      <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
        <feGaussianBlur stdDeviation="2.5" result="blur"/>
        <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
      </filter>`;

    // ---------- Scene 1: Champagne & Diamanten ----------

    const GARLAND = { xs: [70, 190, 310, 490, 610, 730], lengths: [40, 70, 30, 55, 80, 45] };
    function garlandY(x) {
      return quadPoint([0, 30], [400, 110], [800, 30], x / 800)[1];
    }
    const NECKLACE = [[40, 500], [270, 600], [510, 505]];
    const LEFT_FLUTE = { cx: 300, angle: 12 };
    const RIGHT_FLUTE = { cx: 500, angle: -12 };

    function flute(cx, random) {
      let s = `
        <path d="M${cx - 38},150 Q${cx - 40},300 ${cx - 7},345 L${cx + 7},345 Q${cx + 40},300 ${cx + 38},150 Z"
          fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.6" stroke-width="2"/>
        <path d="M${cx - 37},190 Q${cx - 38},300 ${cx - 7},343 L${cx + 7},343 Q${cx + 38},300 ${cx + 37},190 Z"
          fill="url(#cChamp)" opacity="0.92"/>
        <ellipse cx="${cx}" cy="190" rx="37" ry="5" fill="#fff8d8" opacity="0.95"/>
        <ellipse cx="${cx}" cy="150" rx="38" ry="6" fill="none" stroke="#fff" stroke-opacity="0.65" stroke-width="2"/>
        <rect x="${cx - 3}" y="345" width="6" height="125" fill="#fff" fill-opacity="0.55"/>
        <ellipse cx="${cx}" cy="472" rx="46" ry="9" fill="#fff" fill-opacity="0.22" stroke="#fff" stroke-opacity="0.6" stroke-width="2"/>
        <path d="M${cx - 27},165 Q${cx - 29},260 ${cx - 12},322" stroke="#fff" stroke-opacity="0.5" stroke-width="3" fill="none" stroke-linecap="round"/>`;
      for (let k = 0; k < 16; k++) {
        const y = 200 + random() * 130;
        const half = 34 - (y - 190) * 0.18;
        const x = cx + (random() * 2 - 1) * half * 0.75;
        s += `<circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="${(1.2 + random() * 1.8).toFixed(1)}" fill="none" stroke="#fff" stroke-opacity="0.75"/>`;
      }
      return s;
    }

    function drawChampagne(has) {
      const random = seeded(7);
      let s = `<defs>${SHARED_DEFS}
        <radialGradient id="cBg" cx="50%" cy="35%" r="75%">
          <stop offset="0" stop-color="#6b1238"/><stop offset="1" stop-color="#14030b"/>
        </radialGradient>
        <linearGradient id="cChamp" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#fff4c2"/><stop offset="1" stop-color="#e9b949"/>
        </linearGradient>
        <linearGradient id="cSilver" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#7d7d88"/><stop offset="0.35" stop-color="#f4f4f8"/><stop offset="0.7" stop-color="#b8b8c2"/><stop offset="1" stop-color="#5e5e68"/>
        </linearGradient>
        <linearGradient id="cBottle" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0" stop-color="#06180c"/><stop offset="0.4" stop-color="#2f6b43"/><stop offset="1" stop-color="#041008"/>
        </linearGradient>
        <linearGradient id="cVelvet" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#8a1230"/><stop offset="1" stop-color="#3a0512"/>
        </linearGradient>
      </defs>
      <rect width="800" height="600" fill="url(#cBg)"/>`;

      // Art deco sunburst
      s += '<g fill="#f5d77a" opacity="0.08">';
      for (let k = 0; k < 18; k++) {
        const a1 = Math.PI + k * Math.PI / 18, a2 = a1 + Math.PI / 36;
        s += `<path d="M400,520 L${400 + 900 * Math.cos(a1)},${520 + 900 * Math.sin(a1)} L${400 + 900 * Math.cos(a2)},${520 + 900 * Math.sin(a2)} Z"/>`;
      }
      s += "</g>";

      // Confetti
      const confettiColors = ["#f5d77a", "#ffffff", "#ff8fc0", "#e2b54a"];
      for (let k = 0; k < 55; k++) {
        const x = random() * 800, y = 60 + random() * 520, angle = random() * 180;
        const color = confettiColors[Math.floor(random() * confettiColors.length)];
        s += `<rect x="${x.toFixed(0)}" y="${y.toFixed(0)}" width="7" height="3" fill="${color}" opacity="0.7" transform="rotate(${angle.toFixed(0)},${x.toFixed(0)},${y.toFixed(0)})"/>`;
      }
      s += star(735, 250, 15, 6, 5, has("confettiStar") ? "#ff8fc0" : "url(#gold)");

      // Garland with hanging stars
      s += '<path d="M0,30 Q400,110 800,30" stroke="url(#gold)" stroke-width="2.5" fill="none"/>';
      GARLAND.xs.forEach((x, k) => {
        if (k === 4 && has("garlandStar")) return;
        const y = garlandY(x), end = y + GARLAND.lengths[k];

        <rect x="494" y="326" width="52" height="8" rx="3" fill="#9ea3b3"/>
        <path d="M500,326 L505,300 L535,300 L540,326 Z" fill="url(#kChrome)"/>
        <line x1="506" y1="340" x2="503" y2="450" stroke="#fff" stroke-width="3" opacity="0.6"/>`;
      s += has("shakerCap")
        ? '<rect x="512" y="284" width="16" height="16" rx="2" fill="url(#kChrome)"/>'
        : '<circle cx="520" cy="292" r="8" fill="url(#kChrome)"/>';

      // Highball with ice, a straw, an umbrella and a lemon slice
      s += `<rect x="617" y="330" width="66" height="128" fill="url(#kSunset)" opacity="0.9"/>
        <g fill="#fff" fill-opacity="0.25" stroke="#fff" stroke-opacity="0.7" stroke-width="1.5">
          <rect x="624" y="336" width="20" height="18" rx="3" transform="rotate(-8,634,345)"/>
          <rect x="652" y="344" width="20" height="18" rx="3" transform="rotate(10,662,353)"/>
          ${has("iceCube") ? "" : '<rect x="634" y="366" width="20" height="18" rx="3" transform="rotate(4,644,375)"/>'}
        </g>
        <line x1="668" y1="455" x2="702" y2="262" stroke="#fff" stroke-width="6" stroke-linecap="round"/>
        <line x1="668" y1="455" x2="702" y2="262" stroke="#e0367c" stroke-width="6" stroke-dasharray="8 8"/>
        <rect x="615" y="300" width="70" height="160" fill="#fff" fill-opacity="0.1" stroke="#fff" stroke-opacity="0.6" stroke-width="2"/>
        <line x1="622" y1="310" x2="622" y2="450" stroke="#fff" stroke-width="3" opacity="0.5"/>
        <line x1="628" y1="306" x2="590" y2="246" stroke="#e8e0d0" stroke-width="2"/>`;
      const umbrella = has("umbrella") ? "#4fc3f7" : "#ff7ab8";
      s += `<g transform="rotate(-30,590,240)">
          <path d="M556,240 A34,34 0 0,1 624,240 Z" fill="${umbrella}"/>
          <path d="M590,240 L573,209 M590,240 L590,206 M590,240 L607,209" stroke="#fff" stroke-opacity="0.6" stroke-width="1.2"/>
        </g>`;
      if (!has("lemon")) {
        s += `<circle cx="688" cy="302" r="16" fill="#ffe066" stroke="#f2c300" stroke-width="3"/>
          <path d="M688,302 L688,288 M688,302 L700,295 M688,302 L700,309 M688,302 L688,316 M688,302 L676,309 M688,302 L676,295"
            stroke="#fff6c2" stroke-width="1.5"/>`;
      }
      return s;
    }

    function cocktailDifferences() {
      return [
        { id: "discoTile", x: DISCO.cx + 29, y: DISCO.cy - 1, r: 12 },
        { id: "sparkle", x: 462, y: 42, r: 14 },
        { id: "neonHeart", x: 302, y: 153, r: 18 },
        { id: "coaster", x: 360, y: 470, r: 24 },
        { id: "olive", x: 184, y: 332, r: 14 },
        { id: "cherry", x: 410, y: 320, r: 16 },
        { id: "cork", x: 274, y: 486, r: 16 },
        { id: "shakerCap", x: 520, y: 292, r: 14 },
        { id: "iceCube", x: 644, y: 375, r: 16 },
        { id: "umbrella", x: 585, y: 228, r: 24 },
        { id: "lemon", x: 688, y: 302, r: 18 },
      ];
    }

    const SCENES = [
      { name: "Champagne & Diamonds", draw: drawChampagne, differences: champagneDifferences() },
      { name: "The Peacock", draw: drawPeacock, differences: peacockDifferences() },
      { name: "Perfume & Pearls", draw: drawVanity, differences: vanityDifferences() },
      { name: "The Swan", draw: drawSwan, differences: swanDifferences() },
      { name: "Cocktails & Disco Ball", draw: drawCocktails, differences: cocktailDifferences() },
    ];

    // ---------- Game ----------

    const pictureEls = [...document.querySelectorAll(".picture")];
    const overlayEl = document.getElementById("overlay");
    const messageEl = document.getElementById("message");
    const countEl = document.getElementById("count");

    let order = [];         // scenes in random order, so you see them all before repeats
    let orderIndex = -1;
    let scene = null;
    let active = [];        // the differences in this round
    let found = new Set();  // ids that have been found
    let misses = 0;
    let hints = 0;
    let locked = false;
    let startTime = 0;
    let nextRoundTimer = null;
    let solvedCount = Number(localStorage.getItem("spotSolved")) || 0;
    const records = JSON.parse(localStorage.getItem("spotRecords") || "{}");

    function shuffle(arr) {
      for (let i = arr.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [arr[i], arr[j]] = [arr[j], arr[i]];
      }
      return arr;
    }

    function svg(content, className) {
      return `<svg class="${className}" viewBox="0 0 800 600" xmlns="http://www.w3.org/2000/svg">${content}</svg>`;
    }

    function recordKey() {
      return `${scene.name}|${active.length}`;
    }

    // Misses and hints cost time, so clicking around at random doesn't pay off
    function elapsed() {
      return Date.now() - startTime + misses * MISS_PENALTY + hints * HINT_PENALTY;
    }

    function newRound(sameScene = false) {
      clearTimeout(nextRoundTimer);
      if (!sameScene || !scene) {
        orderIndex++;
        if (orderIndex >= order.length) {
          const last = order[order.length - 1];
          order = shuffle(SCENES.slice());
          if (order[0] === last) order.push(order.shift());
          orderIndex = 0;
        }
        scene = order[orderIndex];
      }
      active = shuffle(scene.differences.slice()).slice(0, Number(countEl.value));
      const ids = new Set(active.map(d => d.id));

      // The changed picture is randomly on the left or the right
      const changedSide = Math.random() < 0.5 ? 0 : 1;
      pictureEls.forEach((el, side) => {
        const has = side === changedSide ? id => ids.has(id) : () => false;
        el.innerHTML = svg(scene.draw(has), "art") + svg("", "marks");
      });

      found = new Set();
      misses = 0;
      hints = 0;
      locked = false;
      startTime = Date.now();
      overlayEl.classList.remove("show");
      document.getElementById("sceneName").textContent = scene.name;
      messageEl.textContent = "Click a difference in either picture.";
      updateStats();
    }

    function marksLayers() {
      return pictureEls.map(el => el.querySelector(".marks"));
    }

    function addMark(layer, markup, removeAfter) {
      const group = document.createElementNS("http://www.w3.org/2000/svg", "g");
      group.innerHTML = markup;
      layer.appendChild(group);
      if (removeAfter) setTimeout(() => group.remove(), removeAfter);
    }

    function handleClick(event, side) {
      if (locked) return;
      const rect = pictureEls[side].getBoundingClientRect();
      const x = (event.clientX - rect.left) / rect.width * 800;
      const y = (event.clientY - rect.top) / rect.height * 600;

      const distance = d => Math.hypot(d.x - x, d.y - y);
      const hit = active
        .filter(d => !found.has(d.id) && distance(d) <= d.r + CLICK_MARGIN)
        .sort((a, b) => distance(a) - distance(b))[0];
      if (hit) {
        found.add(hit.id);
        marksLayers().forEach(layer =>
          addMark(layer, `<circle class="found" cx="${hit.x}" cy="${hit.y}" r="${hit.r + 8}"/>`));
        messageEl.textContent = found.size < active.length ? "Found one." : "";
        updateStats();
        if (found.size === active.length) finishRound();
        return;
      }

      // Clicking an already found difference is not a mistake
      if (active.some(d => found.has(d.id) && distance(d) <= d.r + CLICK_MARGIN)) return;
      misses++;
      addMark(marksLayers()[side],
        `<path class="miss" d="M${x - 12},${y - 12} L${x + 12},${y + 12} M${x + 12},${y - 12} L${x - 12},${y + 12}"/>` +
        `<text class="penalty" x="${x + 16}" y="${y - 14}">+${MISS_PENALTY / 1000}s</text>`, 900);
      messageEl.textContent = `No difference there. That costs ${MISS_PENALTY / 1000} seconds.`;
      updateStats();
    }

    function hint() {
      if (locked) return;
      const remaining = active.filter(d => !found.has(d.id));
      const d = remaining[Math.floor(Math.random() * remaining.length)];
      hints++;
      marksLayers().forEach(layer =>
        addMark(layer, `<circle class="hintmark" cx="${d.x}" cy="${d.y}" r="${d.r * 2.6}"/>`, 2500));
      messageEl.textContent = `Look inside the orange circle… (+${HINT_PENALTY / 1000} seconds)`;
      updateStats();
    }

    // Give up: show where the remaining differences were
    function reveal() {
      if (locked) return;
      locked = true;
      const remaining = active.filter(d => !found.has(d.id));
      marksLayers().forEach(layer => remaining.forEach(d =>
        addMark(layer, `<circle class="revealed" cx="${d.x}" cy="${d.y}" r="${d.r + 8}"/>`)));
      messageEl.textContent = `Here are the last ${remaining.length}. Press next for a new picture.`;
      updateStats();
    }

    function finishRound() {
      locked = true;
      solvedCount++;
      localStorage.setItem("spotSolved", solvedCount);

      const time = elapsed();
      const previous = records[recordKey()];
      const isRecord = previous === undefined || time < previous;
      if (isRecord) {
        records[recordKey()] = time;
        localStorage.setItem("spotRecords", JSON.stringify(records));
      }

      const extras = [];
      if (misses) extras.push(`${misses} ${misses === 1 ? "miss" : "misses"}`);
      if (hints) extras.push(`${hints} ${hints === 1 ? "hint" : "hints"}`);
      overlayEl.innerHTML =
        `<strong>${isRecord ? "New record" : "All found"} in ${formatTime(time)}</strong>` +
        `<span class="meta">${active.length} differences` +
        `${extras.map(e => ` \\ ${e}`).join("")}` +
        `${isRecord ? "" : ` \\ record ${formatTime(previous)}`} \\ next picture loading</span>`;
      overlayEl.classList.add("show");
      updateStats();
      nextRoundTimer = setTimeout(newRound, NEXT_ROUND_DELAY);
    }

    function updateStats() {
      document.getElementById("found").textContent = found.size;
      document.getElementById("total").textContent = active.length;
      document.getElementById("misses").textContent = misses;
      document.getElementById("hints").textContent = hints;
      document.getElementById("solved").textContent = solvedCount;
      const record = records[recordKey()];
      document.getElementById("record").textContent = record === undefined ? "–" : formatTime(record);
      document.getElementById("time").textContent = formatTime(elapsed());
    }

    function formatTime(ms) {
      const s = Math.floor(ms / 1000);
      return `${Math.floor(s / 60)}:${String(s % 60).padStart(2, "0")}`;
    }

    setInterval(() => {
      if (!locked) document.getElementById("time").textContent = formatTime(elapsed());
    }, 250);

    // ---------- Controls ----------

    pictureEls.forEach((el, side) => el.addEventListener("click", e => handleClick(e, side)));
    document.getElementById("hintBtn").addEventListener("click", hint);
    document.getElementById("revealBtn").addEventListener("click", reveal);
    document.getElementById("skipBtn").addEventListener("click", () => newRound());
    countEl.value = localStorage.getItem("spotCount") || "7";
    countEl.addEventListener("change", () => {
      countEl.blur();
      localStorage.setItem("spotCount", countEl.value);
      newRound(true);
    });
    window.addEventListener("keydown", e => {
      const key = e.key.toLowerCase();
      if (key === "h") hint();
      if (key === "s") reveal();
      if (key === "n") newRound();
    });

    newRound();
  </script>
</body>
</html>
