<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sudoku and more</title>
  <style>
    html, body {
      margin: 0;
      min-height: 100%;
      background: #0b0b1a;
      color: #fff;
      font-family: system-ui, sans-serif;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 48px 20px;
    }
    h1 {
      margin: 0 0 8px;
      font-size: 32px;
    }
    p {
      margin: 0 0 32px;
      color: #9a9ac0;
    }
    .games {
      display: grid;
      gap: 14px;
    }
    a.game {
      display: block;
      padding: 18px 20px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      text-decoration: none;
      transition: background-color 200ms;
    }
    a.game:hover { background: rgba(255, 255, 255, 0.14); }
    a.game strong {
      display: block;
      margin-bottom: 4px;
      font-size: 18px;
    }
    a.game span { color: #9a9ac0; font-size: 14px; }
  </style>
</head>
<body>
  <main>
    <h1>Sudoku and more</h1>
    <p>Small games that run in your browser. Nothing to install.</p>

    <div class="games">
      <a class="game" href="sudoku.html">
        <strong>Sudoku</strong>
        <span>Difficulty 1 to 10, hints, and a solver that explains every step</span>
      </a>
      <a class="game" href="verschillen.html">
        <strong>Zoek de verschillen</strong>
        <span>Spot the difference in three glamorous scenes (in Dutch)</span>
      </a>
      <a class="game" href="balls.html">
        <strong>Bouncing balls</strong>
        <span>Click to add balls and toggle gravity</span>
      </a>
    </div>
  </main>
</body>
</html>
