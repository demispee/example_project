<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Bouncing balls \ LAB271</title>
  <style>
    /* Lab271 design system, dark theme. TT Interphases is licensed via Schuberg Philis
       and loads from a local fonts/ folder that is not shared; elsewhere the fallbacks apply. */
    @font-face { font-family: "TT Interphases"; src: local("TT Interphases"), url("fonts/TTInterphases-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "TT Interphases"; src: local("TT Interphases Bold"), url("fonts/TTInterphases-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
    @font-face { font-family: "TT Interphases"; src: local("TT Interphases Black"), url("fonts/TTInterphases-Black.ttf") format("truetype"); font-weight: 900; font-display: swap; }
    @font-face { font-family: "TT Interphases Mono"; src: local("TT Interphases Mono"), url("fonts/TTInterphasesMono-Regular.ttf") format("truetype"); font-weight: 400; font-display: swap; }
    @font-face { font-family: "TT Interphases Mono"; src: local("TT Interphases Mono Bold"), url("fonts/TTInterphasesMono-Bold.ttf") format("truetype"); font-weight: 700; font-display: swap; }
    :root {
      --c-canvas: #020C17;
      --c-canvas-2: #061323;
      --c-panel: #082646;
      --c-text: #FFFFFF;
      --c-muted: #8AA0B8;
      --c-border: #12263F;
      --c-tq: #1EE8ED;
      --c-orange: #FF8D33;
      --sans: "TT Interphases", "Avenir Next", "Poppins", "Inter", sans-serif;
      --mono: "TT Interphases Mono", "Courier New", monospace;
      --motion: 200ms cubic-bezier(.2, 0, .2, 1);
    }

    html, body {
      margin: 0;
      height: 100%;
      overflow: hidden;
      background: var(--c-canvas);
      color: var(--c-text);
      font-family: var(--sans);
      -webkit-font-smoothing: antialiased;
    }
    canvas {
      display: block;
      cursor: crosshair;
    }
    #panel {
      position: fixed;
      top: 20px;
      left: 20px;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      gap: 10px;
      padding: 18px 22px;
      border: 1px solid var(--c-border);
      border-radius: 20px 20px 20px 0;
      background: color-mix(in srgb, var(--c-canvas-2) 88%, transparent);
      user-select: none;
    }
    .back {
      display: inline-flex;
      align-items: center;
      height: 32px;
      padding: 0 16px;
      border: 1px solid var(--c-border);
      border-radius: 999px;
      color: var(--c-muted);
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-decoration: none;
      transition: color var(--motion), border-color var(--motion);
    }
    .back:hover { color: var(--c-tq); border-color: var(--c-tq); }
    .back:focus-visible {
      outline: 2px solid var(--c-tq);
      outline-offset: 2px;
    }
    .eyebrow {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.08em;
      color: var(--c-tq);
    }
    strong {
      font-size: 28px;
      font-weight: 900;
      letter-spacing: -0.04em;
      line-height: 1.09;
    }
    .help {
      font-family: var(--mono);
      font-size: 11px;
      letter-spacing: 0.06em;
      line-height: 2;
      color: var(--c-muted);
    }
    .bs { color: var(--c-tq); }
    #panel.compact > :not(.back) { display: none; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <div id="panel">
    <a class="back" href="index.html">← back</a>
    <div class="eyebrow">LAB271 \ bouncing balls \ <span id="count"></span></div>
    <strong>Click to add balls</strong>
    <div class="help" id="help">
      g <span class="bs">\</span> gravity <span id="gravity">on</span> &nbsp;
      c <span class="bs">\</span> clear &nbsp;
      h <span class="bs">\</span> hide panel
    </div>
  </div>

  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");
    const GRAVITY = 0.25;
    const BOUNCINESS = 0.9;
    // Lab271 colors, each as [highlight, base]
    const COLORS = [
      ["#B5FAFB", "#1EE8ED"],
      ["#FFD3AE", "#FF8D33"],
      ["#FF8CC8", "#FF0089"],
      ["#A9CBEA", "#347EC1"],
    ];

    let balls = [];
    let gravityOn = true;

    function resize() {
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
    }

    function random(min, max) {
      return Math.random() * (max - min) + min;
    }

    function addBall(x, y) {
      balls.push({
        x,
        y,
        vx: random(-6, 6),
        vy: random(-8, 2),
        radius: random(12, 34),
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
      });
    }

    function moveBall(ball) {
      if (gravityOn) ball.vy += GRAVITY;
      ball.x += ball.vx;
      ball.y += ball.vy;

      // Bounce off the edges of the window
      if (ball.x - ball.radius < 0 || ball.x + ball.radius > canvas.width) {
        ball.vx *= -BOUNCINESS;
        ball.x = Math.min(Math.max(ball.x, ball.radius), canvas.width - ball.radius);
      }
      if (ball.y - ball.radius < 0 || ball.y + ball.radius > canvas.height) {
        ball.vy *= -BOUNCINESS;
        ball.y = Math.min(Math.max(ball.y, ball.radius), canvas.height - ball.radius);
      }
    }

    // Let two balls bounce off each other, with bigger balls being heavier
    function collide(a, b) {
      const dx = b.x - a.x;
      const dy = b.y - a.y;
      const distance = Math.hypot(dx, dy);
      const minDistance = a.radius + b.radius;
      if (distance === 0 || distance >= minDistance) return;

      const nx = dx / distance;
      const ny = dy / distance;
      const massA = a.radius ** 2;
      const massB = b.radius ** 2;

      // Push the balls apart so they don't overlap
      const overlap = minDistance - distance;
      a.x -= nx * overlap * (massB / (massA + massB));
      a.y -= ny * overlap * (massB / (massA + massB));
      b.x += nx * overlap * (massA / (massA + massB));
      b.y += ny * overlap * (massA / (massA + massB));

      // Exchange speed along the line between their centers
      const speed = (a.vx - b.vx) * nx + (a.vy - b.vy) * ny;
      if (speed <= 0) return;
      const impulse = (2 * speed) / (massA + massB);
      a.vx -= impulse * massB * nx;
      a.vy -= impulse * massB * ny;
      b.vx += impulse * massA * nx;
      b.vy += impulse * massA * ny;
    }

    function drawBall(ball) {
      const gradient = ctx.createRadialGradient(
        ball.x - ball.radius / 3, ball.y - ball.radius / 3, ball.radius / 6,
        ball.x, ball.y, ball.radius
      );
      gradient.addColorStop(0, ball.color[0]);
      gradient.addColorStop(1, ball.color[1]);

      ctx.beginPath();
      ctx.arc(ball.x, ball.y, ball.radius, 0, Math.PI * 2);
      ctx.fillStyle = gradient;
      ctx.shadowColor = ball.color[1];
      ctx.shadowBlur = 20;
      ctx.fill();
    }

    function frame() {
      // A see-through background leaves short trails behind the balls
      ctx.shadowBlur = 0;
      ctx.fillStyle = "rgba(2, 12, 23, 0.25)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      balls.forEach(moveBall);
      for (let i = 0; i < balls.length; i++) {
        for (let j = i + 1; j < balls.length; j++) {
          collide(balls[i], balls[j]);
        }
      }
      balls.forEach(drawBall);

      document.getElementById("count").textContent = `${balls.length} balls`;
      requestAnimationFrame(frame);
    }

    canvas.addEventListener("click", (event) => {
      for (let i = 0; i < 5; i++) addBall(event.clientX, event.clientY);
    });

    window.addEventListener("keydown", (event) => {
      const key = event.key.toLowerCase();
      if (key === "g") {
        gravityOn = !gravityOn;
        document.getElementById("gravity").textContent = gravityOn ? "on" : "off";
      } else if (key === "c") {
        balls = [];
      } else if (key === "h") {
        document.getElementById("panel").classList.toggle("compact");
      }
    });

    window.addEventListener("resize", resize);
    resize();
    for (let i = 0; i < 20; i++) {
      addBall(random(50, canvas.width - 50), random(50, canvas.height / 2));
    }
    frame();
  </script>
</body>
</html>
